<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Practice hiragana and katakana — pick the characters you want, then read or write them.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#f6f7fb">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Hiragana Dojo — Hiragana &amp; Katakana Practice</title>
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("hiragana-dojo-theme-v2") || "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Japanese Dojo home">
      <span class="brand-mark" lang="ja">あ</span>
      <strong>Japanese Dojo</strong>
    </a>
    <div class="topbar-tools">
    <button id="soundToggle" class="icon-button" type="button" aria-label="Turn sound off" aria-pressed="true">
      <span id="soundIcon" class="theme-icon" aria-hidden="true"></span>
    </button>
    <button id="themeToggle" class="icon-button" type="button" aria-label="Switch to dark theme">
      <span id="themeIcon" class="theme-icon" aria-hidden="true"></span>
    </button>
    </div>
  </header>

  <main class="app">
    <!-- ============ HOME: pick characters ============ -->
    <section id="homePage" class="home" aria-labelledby="homeTitle">
      <h1 id="homeTitle">Pick characters to practice</h1>

      <div class="script-tabs" role="tablist" aria-label="Writing system">
        <button class="script-tab" id="tab-hiragana" data-script="hiragana" role="tab" aria-selected="true" aria-controls="kanaGroups" type="button">
          <span class="script-tab-kana" lang="ja" aria-hidden="true">あ</span>
          <span>Hiragana</span>
          <span class="script-tab-count" id="tabCount-hiragana">0</span>
        </button>
        <button class="script-tab" id="tab-katakana" data-script="katakana" role="tab" aria-selected="false" aria-controls="kanaGroups" tabindex="-1" type="button">
          <span class="script-tab-kana" lang="ja" aria-hidden="true">ア</span>
          <span>Katakana</span>
          <span class="script-tab-count" id="tabCount-katakana">0</span>
        </button>
      </div>

      <div class="selection-bar">
        <p id="selectionSummary" class="selection-summary">0 of 0 selected</p>
        <div class="selection-actions">
          <button id="selectAll" class="text-button" type="button">Select all</button>
          <button id="selectNone" class="text-button" type="button">Clear</button>
        </div>
      </div>

      <div id="kanaGroups" class="kana-sections" role="tabpanel" aria-labelledby="tab-hiragana"></div>
    </section>

    <!-- ============ PRACTICE ============ -->
    <section id="quizPanel" class="practice" hidden aria-label="Practice">
      <div class="practice-top">
        <button id="exitPractice" class="icon-button" type="button" aria-label="End practice (Esc)" title="End practice (Esc)">✕</button>
        <div class="progress-track" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>
        <span id="progressLabel" class="progress-count">1/1</span>
      </div>

      <div class="question-card">
        <p id="questionType" class="question-type">Type the romaji</p>
        <div id="questionDisplay" class="question-display" lang="ja">あ</div>
        <form id="answerForm" class="answer-form" autocomplete="off">
          <label class="sr-only" for="answerInput">Your answer</label>
          <input id="answerInput" class="answer-input" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
          <button id="checkButton" class="button button-primary check-button" type="submit">
            <span class="check-label">Check</span>
            <svg class="check-tick tick-svg" viewBox="0 0 24 24" aria-hidden="true"><polyline points="5 12.5 10 17.5 19 7"/></svg>
          </button>
        </form>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <div class="answer-actions">
          <button id="revealButton" class="text-button reveal-button" type="button">Show answer</button>
          <button id="nextButton" class="button button-primary next-button" type="button" hidden>Continue →</button>
        </div>
      </div>

      <div id="kanaKeyboard" class="kb-mount"></div>

      <div id="completion" class="completion" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <p id="completionScore" class="completion-score">0/0</p>
        <p id="completionTitle" class="completion-title">Well done!</p>
        <p id="completionSummary" class="completion-text"></p>
        <div id="missedReview" class="missed-review" hidden>
          <p class="missed-title">Review these</p>
          <div id="missedList" class="missed-list"></div>
        </div>
        <div class="completion-actions">
          <button id="practiceMissed" class="button button-primary" type="button" hidden>Practice missed</button>
          <button id="practiceAgain" class="button button-quiet" type="button">Again</button>
          <button id="backToSelection" class="button button-quiet" type="button">Done</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ START BAR (home only) ============ -->
  <div id="startBar" class="start-bar">
    <div class="start-bar-inner">
      <div class="mode-switch" role="radiogroup" aria-label="Practice mode">
        <button class="mode-button" type="button" role="radio" data-mode="read" aria-checked="false">
          <strong>Read</strong><small lang="ja">あ → a</small>
        </button>
        <button class="mode-button" type="button" role="radio" data-mode="write" aria-checked="false">
          <strong>Write</strong><small lang="ja">a → あ</small>
        </button>
        <button class="mode-button" type="button" role="radio" data-mode="both" aria-checked="true">
          <strong>Both</strong><small lang="ja">あ ⇄ a</small>
        </button>
      </div>
      <button id="practiceButton" class="button button-primary start-button" type="button">Start</button>
    </div>
  </div>

  <script src="sound.js"></script>
  <script src="keyboard.js"></script>
  <script src="script.js"></script>
</body>
</html>
